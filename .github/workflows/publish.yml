name: Build and publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: filebrowser-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --configuration Release --nologo
      - name: Build image
        run: docker build -t filebrowser-ci .
      - name: Publish tagged image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported version tag: $TAG" >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Set the DOCKERHUB_TOKEN repository secret." >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "Set the DOCKERHUB_USERNAME repository variable or secret." >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          image="dotmeer/filebrowser"
          version="${TAG#v}"
          docker tag filebrowser-ci "$image:$version"
          docker push "$image:$version"
          if [[ "$TAG" != *-* ]]; then
            git fetch --force --tags origin
            newest=$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)
            if [[ "$TAG" == "$newest" ]]; then
              docker tag filebrowser-ci "$image:latest"
              docker push "$image:latest"
            fi
          fi

